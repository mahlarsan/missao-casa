<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C5CFF">
<title>Missão Casa</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --roxo:#7C5CFF; --rosa:#FF5FA2; --amarelo:#FFC93C; --verde:#2BC48A; --azul:#3BA7FF; --laranja:#FF8A3D;
    --fundo:#FFF8EE; --card:#FFFFFF; --texto:#2B2547; --suave:#8A84A3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;background:var(--fundo);color:var(--texto);
       padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  header{background:linear-gradient(135deg,var(--roxo),var(--rosa));color:#fff;padding:20px 18px 26px;
         border-radius:0 0 28px 28px;box-shadow:0 6px 18px rgba(124,92,255,.25)}
  header h1{margin:0;font-size:24px;letter-spacing:.3px}
  header p{margin:4px 0 0;opacity:.9;font-size:14px}
  main{padding:16px;max-width:560px;margin:0 auto}
  h2{font-size:19px;margin:18px 4px 10px}
  .kids{display:flex;gap:10px;margin-top:-34px;overflow-x:auto;padding:4px 2px 8px}
  .kid{flex:1;min-width:110px;background:var(--card);border:3px solid transparent;border-radius:20px;padding:10px;
       text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.07);font-weight:800}
  .kid .av{font-size:30px}
  .kid.on{border-color:var(--amarelo);transform:translateY(-2px)}
  .kid small{display:block;color:var(--suave);font-weight:700}
  .missao{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;
          box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer;border-left:8px solid var(--c,var(--azul));transition:transform .15s}
  .missao:active{transform:scale(.97)}
  .missao .ic{font-size:30px}
  .missao .tx{flex:1;font-weight:800;font-size:16px}
  .missao .tx small{display:block;color:var(--suave);font-weight:700;font-size:13px}
  .missao .ok{width:34px;height:34px;border-radius:50%;border:3px solid #E3DFF2;display:grid;place-items:center;font-size:18px}
  .missao.feita{opacity:.6}
  .missao.feita .ok{background:var(--verde);border-color:var(--verde);color:#fff}
  .missao.feita .tx{text-decoration:line-through}
  .vazio{text-align:center;color:var(--suave);padding:24px;font-weight:700}
  .vez{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
  .vez .t{font-weight:800;color:var(--suave);font-size:14px}
  .vez .quem{font-size:26px;font-weight:900;margin:6px 0}
  .fila{display:flex;gap:6px;flex-wrap:wrap}
  .fila span{background:#F1EEFF;border-radius:12px;padding:4px 10px;font-weight:800;font-size:13px}
  .fila span.agora{background:var(--amarelo)}
  .placar{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
  .placar .linha{display:flex;justify-content:space-between;font-weight:900;font-size:17px}
  .barra{height:16px;background:#EFEAFB;border-radius:10px;margin:10px 0 6px;overflow:hidden}
  .barra i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--verde),var(--azul));transition:width .5s}
  .placar small{color:var(--suave);font-weight:700}
  .premio{background:linear-gradient(135deg,var(--amarelo),var(--laranja));color:#3a2600;border-radius:20px;padding:16px;font-weight:800;margin-bottom:12px}
  .premio b{font-size:20px;display:block}
  .dias{display:flex;gap:6px;margin-top:8px}
  .dias span{flex:1;text-align:center;font-size:12px;font-weight:800;color:var(--suave)}
  .dias span i{display:block;height:26px;border-radius:8px;background:#EFEAFB;margin-bottom:3px;font-style:normal;line-height:26px;font-size:14px}
  .dias span i.sim{background:var(--verde);color:#fff}
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:space-around;
      padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08);border-radius:22px 22px 0 0}
  nav button{background:none;border:0;font:inherit;font-weight:800;font-size:12px;color:var(--suave);display:flex;flex-direction:column;
             align-items:center;gap:2px;padding:6px 10px;border-radius:14px;cursor:pointer}
  nav button span{font-size:22px}
  nav button.on{color:var(--roxo);background:#F1EEFF}
  .tela{display:none}.tela.on{display:block;animation:entra .25s}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .bloco{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
  .item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #EEE;font-weight:700}
  .item:last-child{border:0}
  .item .x{margin-left:auto;background:#FFE8EF;color:#D23A6B;border:0;border-radius:10px;padding:4px 10px;font-weight:800;cursor:pointer}
  input,select{font:inherit;padding:10px;border-radius:12px;border:2px solid #E6E1F5;width:100%;margin:4px 0;background:#fff}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .btn{background:var(--roxo);color:#fff;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:900;width:100%;margin-top:6px;cursor:pointer}
  .btn.sec{background:#F1EEFF;color:var(--roxo)}
  .toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) scale(.8);background:var(--texto);color:#fff;padding:12px 18px;
         border-radius:16px;font-weight:900;opacity:0;transition:.25s;z-index:20;pointer-events:none;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) scale(1)}
  .confete{position:fixed;top:-20px;font-size:22px;z-index:19;pointer-events:none;animation:cai 1.4s ease-in forwards}
  @keyframes cai{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
  .pin{max-width:260px;margin:30px auto;text-align:center}
</style>
</head>
<body>
<header>
  <h1>🏠 Missão Casa</h1>
  <p id="hoje"></p>
</header>
<main>
  <div class="kids" id="kids"></div>

  <!-- Tela 1: Missões do dia -->
  <section class="tela on" id="t-missoes">
    <h2 id="titMissoes">Missões de hoje</h2>
    <div id="listaMissoes"></div>
  </section>

  <!-- Tela 2: Revezamento -->
  <section class="tela" id="t-vez">
    <h2>🔄 De quem é a vez hoje?</h2>
    <div id="listaVez"></div>
  </section>

  <!-- Tela 3: Placar -->
  <section class="tela" id="t-placar">
    <h2>🏆 Placar da semana</h2>
    <div class="premio" id="premio"></div>
    <div id="listaPlacar"></div>
  </section>

  <!-- Tela 4: Pais -->
  <section class="tela" id="t-pais">
    <div id="paisConteudo"></div>
  </section>
</main>

<nav>
  <button class="on" data-t="missoes"><span>⭐</span>Missões</button>
  <button data-t="vez"><span>🔄</span>Vez</button>
  <button data-t="placar"><span>🏆</span>Placar</button>
  <button data-t="pais"><span>🔒</span>Pais</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ===== Dados (por enquanto ficam salvos neste aparelho) ===== */
const CHAVE = "missaoCasa.v1";
const PADRAO = {
  pin: "1234",
  criancas: [
    { id: "maya", nome: "Maya", avatar: "🦄" },
    { id: "leon", nome: "Leon", avatar: "🦁" }
  ],
  tarefas: [
    { id: "t1", nome: "Arrumar a cama", icone: "🛏️", pontos: 5, para: "todos", cor: "#3BA7FF" },
    { id: "t2", nome: "Guardar o material da escola", icone: "🎒", pontos: 5, para: "todos", cor: "#FF5FA2" },
    { id: "t3", nome: "Tirar o lixo", icone: "🗑️", pontos: 10, para: "vez:lixo", cor: "#2BC48A" },
    { id: "t4", nome: "Arrumar a mesa", icone: "🍽️", pontos: 10, para: "vez:mesa", cor: "#FF8A3D" },
    { id: "t5", nome: "Escovar os dentes à noite", icone: "🪥", pontos: 5, para: "todos", cor: "#7C5CFF" }
  ],
  revezamentos: [
    { id: "banho", nome: "Quem toma banho primeiro", icone: "🛁", ordem: ["maya", "leon"] },
    { id: "lixo", nome: "Quem tira o lixo", icone: "🗑️", ordem: ["leon", "maya"] },
    { id: "mesa", nome: "Quem arruma a mesa", icone: "🍽️", ordem: ["maya", "leon"] }
  ],
  premio: { texto: "Escolher o filme de sexta + pipoca 🍿", meta: 150 },
  feitos: {} // { "2026-11-13": { "maya": ["t1","t3"] } }
};
let dados = carregar();
let criancaAtiva = dados.criancas[0]?.id;
let paisLiberado = false;

function carregar(){
  try { const s = localStorage.getItem(CHAVE); if (s) return JSON.parse(s); } catch(e){}
  return structuredClone(PADRAO);
}
function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify(dados)); } catch(e){} }

/* ===== Datas ===== */
const hojeStr = () => isoDia(new Date());
function isoDia(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function numeroDoDia(d){ return Math.floor(new Date(isoDia(d)+"T12:00:00").getTime() / 86400000); }
function inicioSemana(d){ const x = new Date(d); const dow = (x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
function diasDaSemana(){ const ini = inicioSemana(new Date()); return [...Array(7)].map((_,i)=>{ const x=new Date(ini); x.setDate(ini.getDate()+i); return x; }); }

/* ===== Regras ===== */
const crianca = id => dados.criancas.find(c => c.id === id);
function daVez(rev, d = new Date()){
  const ordem = rev.ordem.filter(id => crianca(id));
  if (!ordem.length) return null;
  return ordem[((numeroDoDia(d) % ordem.length) + ordem.length) % ordem.length];
}
function tarefasDe(idCrianca, d = new Date()){
  return dados.tarefas.filter(t => {
    if (t.para === "todos") return true;
    if (t.para.startsWith("vez:")) { const r = dados.revezamentos.find(r => r.id === t.para.slice(4)); return r && daVez(r, d) === idCrianca; }
    return t.para === idCrianca;
  });
}
const feitosEm = (dia, id) => (dados.feitos[dia] && dados.feitos[dia][id]) || [];
function pontosDoDia(dia, id){ return feitosEm(dia, id).reduce((s, tid) => s + (dados.tarefas.find(t => t.id === tid)?.pontos || 0), 0); }
function pontosSemana(id){ return diasDaSemana().reduce((s, d) => s + pontosDoDia(isoDia(d), id), 0); }
function sequencia(id){
  let n = 0; const d = new Date();
  if (!diaCompleto(isoDia(d), id, d)) d.setDate(d.getDate()-1);
  while (n < 365 && diaCompleto(isoDia(d), id, d)) { n++; d.setDate(d.getDate()-1); }
  return n;
}
function diaCompleto(dia, id, d){ const ts = tarefasDe(id, d); return ts.length > 0 && ts.every(t => feitosEm(dia, id).includes(t.id)); }

/* ===== Interface ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderCabecalho(){
  $("#hoje").textContent = new Date().toLocaleDateString("pt-BR", { weekday:"long", day:"numeric", month:"long" });
  $("#kids").innerHTML = dados.criancas.map(c => `
    <div class="kid ${c.id===criancaAtiva?"on":""}" data-id="${c.id}">
      <div class="av">${esc(c.avatar)}</div>${esc(c.nome)}
      <small>⭐ ${pontosSemana(c.id)} · 🔥 ${sequencia(c.id)}</small>
    </div>`).join("");
  document.querySelectorAll(".kid").forEach(el => el.onclick = () => { criancaAtiva = el.dataset.id; render(); });
}

function renderMissoes(){
  const c = crianca(criancaAtiva); if (!c) { $("#listaMissoes").innerHTML = `<div class="vazio">Cadastre as crianças no painel dos pais 🔒</div>`; return; }
  $("#titMissoes").textContent = `Missões de hoje, ${c.nome}!`;
  const ts = tarefasDe(c.id), feitas = feitosEm(hojeStr(), c.id);
  $("#listaMissoes").innerHTML = ts.length ? ts.map(t => `
    <div class="missao ${feitas.includes(t.id)?"feita":""}" style="--c:${esc(t.cor)}" data-id="${t.id}">
      <div class="ic">${esc(t.icone)}</div>
      <div class="tx">${esc(t.nome)}<small>+${t.pontos} pontos</small></div>
      <div class="ok">${feitas.includes(t.id)?"✓":""}</div>
    </div>`).join("") : `<div class="vazio">Nenhuma missão hoje. Dia de folga! 🎉</div>`;
  document.querySelectorAll(".missao").forEach(el => el.onclick = () => alternar(el.dataset.id));
}

function alternar(tid){
  const dia = hojeStr();
  dados.feitos[dia] = dados.feitos[dia] || {};
  const lista = dados.feitos[dia][criancaAtiva] = dados.feitos[dia][criancaAtiva] || [];
  const i = lista.indexOf(tid);
  if (i >= 0) { lista.splice(i, 1); }
  else {
    lista.push(tid);
    const t = dados.tarefas.find(t => t.id === tid);
    if (diaCompleto(dia, criancaAtiva, new Date())) { toast("🏅 Todas as missões feitas! Sequência: " + sequencia(criancaAtiva) + " 🔥"); confete(40); }
    else { toast(`+${t.pontos} pontos! ⭐`); confete(12); }
  }
  salvar(); render();
}

function renderVez(){
  $("#listaVez").innerHTML = dados.revezamentos.length ? dados.revezamentos.map(r => {
    const agora = daVez(r), amanha = new Date(); amanha.setDate(amanha.getDate()+1);
    const prox = daVez(r, amanha), c = crianca(agora), cp = crianca(prox);
    return `<div class="vez">
      <div class="t">${esc(r.icone)} ${esc(r.nome)}</div>
      <div class="quem">${c ? esc(c.avatar)+" "+esc(c.nome) : "—"}</div>
      <div class="fila">${r.ordem.filter(crianca).map(id => `<span class="${id===agora?"agora":""}">${esc(crianca(id).nome)}</span>`).join("")}</div>
      ${cp ? `<small style="color:var(--suave);font-weight:700;display:block;margin-top:8px">Amanhã: ${esc(cp.nome)}</small>` : ""}
    </div>`; }).join("") : `<div class="vazio">Nenhum revezamento ainda.</div>`;
}

function renderPlacar(){
  const meta = Number(dados.premio.meta) || 100;
  $("#premio").innerHTML = `🎁 Prêmio da semana<b>${esc(dados.premio.texto)}</b>Quem chegar a ${meta} pontos até domingo ganha!`;
  const dias = diasDaSemana(), letras = ["S","T","Q","Q","S","S","D"];
  $("#listaPlacar").innerHTML = [...dados.criancas].sort((a,b) => pontosSemana(b.id) - pontosSemana(a.id)).map(c => {
    const p = pontosSemana(c.id), pct = Math.min(100, Math.round(p / meta * 100));
    return `<div class="placar">
      <div class="linha"><span>${esc(c.avatar)} ${esc(c.nome)}</span><span>${p} ⭐</span></div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      <small>${pct >= 100 ? "🎉 Ganhou o prêmio!" : `Faltam ${meta - p} pontos`} · 🔥 ${sequencia(c.id)} dia(s) seguidos</small>
      <div class="dias">${dias.map((d,i) => `<span><i class="${diaCompleto(isoDia(d), c.id, d) ? "sim" : ""}">${diaCompleto(isoDia(d), c.id, d) ? "✓" : ""}</i>${letras[i]}</span>`).join("")}</div>
    </div>`; }).join("");
}

function renderPais(){
  const el = $("#paisConteudo");
  if (!paisLiberado) {
    el.innerHTML = `<div class="pin"><h2>🔒 Área dos pais</h2><input id="pinIn" type="password" inputmode="numeric" placeholder="Senha (padrão 1234)"><button class="btn" id="pinBtn">Entrar</button></div>`;
    $("#pinBtn").onclick = () => { if ($("#pinIn").value === dados.pin) { paisLiberado = true; renderPais(); } else toast("Senha errada 🙈"); };
    return;
  }
  const opPara = `<option value="todos">Todas as crianças</option>` +
    dados.criancas.map(c => `<option value="${c.id}">Só ${esc(c.nome)}</option>`).join("") +
    dados.revezamentos.map(r => `<option value="vez:${r.id}">Revezando: ${esc(r.nome)}</option>`).join("");
  el.innerHTML = `
    <h2>👨‍👩‍👧‍👦 Painel dos pais</h2>
    <div class="bloco"><b>🎁 Prêmio da semana</b>
      <input id="prTx" value="${esc(dados.premio.texto)}"><div class="row"><input id="prMeta" type="number" value="${dados.premio.meta}"><button class="btn" id="prSalvar">Salvar</button></div></div>
    <div class="bloco"><b>⭐ Missões</b>
      ${dados.tarefas.map(t => `<div class="item">${esc(t.icone)} ${esc(t.nome)} <small style="color:var(--suave)">(${t.pontos})</small><button class="x" data-del-t="${t.id}">tirar</button></div>`).join("")}
      <div class="row"><input id="tIc" placeholder="Emoji" style="max-width:80px" value="⭐"><input id="tNome" placeholder="Nova missão"></div>
      <div class="row"><input id="tPts" type="number" value="5" style="max-width:90px"><select id="tPara">${opPara}</select></div>
      <button class="btn" id="tAdd">Adicionar missão</button></div>
    <div class="bloco"><b>🔄 Revezamentos</b>
      ${dados.revezamentos.map(r => `<div class="item">${esc(r.icone)} ${esc(r.nome)}<button class="x" data-del-r="${r.id}">tirar</button></div>`).join("")}
      <div class="row"><input id="rIc" placeholder="Emoji" style="max-width:80px" value="🔄"><input id="rNome" placeholder="Ex.: quem escolhe o desenho"></div>
      <button class="btn" id="rAdd">Adicionar revezamento</button></div>
    <div class="bloco"><b>🧒 Crianças</b>
      ${dados.criancas.map(c => `<div class="item">${esc(c.avatar)} ${esc(c.nome)}<button class="x" data-del-c="${c.id}">tirar</button></div>`).join("")}
      <div class="row"><input id="cAv" placeholder="Emoji" style="max-width:80px" value="🐼"><input id="cNome" placeholder="Nome"></div>
      <button class="btn" id="cAdd">Adicionar criança</button></div>
    <div class="bloco"><b>🔑 Senha dos pais</b><div class="row"><input id="novoPin" type="password" placeholder="Nova senha"><button class="btn" id="pinSalvar">Trocar</button></div></div>
    <button class="btn sec" id="sair">Sair do painel</button>`;

  $("#prSalvar").onclick = () => { dados.premio = { texto: $("#prTx").value || "Prêmio surpresa", meta: Number($("#prMeta").value) || 100 }; salvar(); toast("Prêmio salvo 🎁"); render(); };
  $("#tAdd").onclick = () => { const n = $("#tNome").value.trim(); if (!n) return;
    const cores = ["#3BA7FF","#FF5FA2","#2BC48A","#FF8A3D","#7C5CFF","#FFC93C"];
    dados.tarefas.push({ id: "t"+Date.now(), nome: n, icone: $("#tIc").value || "⭐", pontos: Number($("#tPts").value) || 5, para: $("#tPara").value, cor: cores[dados.tarefas.length % cores.length] });
    salvar(); render(); };
  $("#rAdd").onclick = () => { const n = $("#rNome").value.trim(); if (!n) return;
    dados.revezamentos.push({ id: "r"+Date.now(), nome: n, icone: $("#rIc").value || "🔄", ordem: dados.criancas.map(c => c.id) }); salvar(); render(); };
  $("#cAdd").onclick = () => { const n = $("#cNome").value.trim(); if (!n) return;
    const id = "c"+Date.now(); dados.criancas.push({ id, nome: n, avatar: $("#cAv").value || "🙂" });
    dados.revezamentos.forEach(r => r.ordem.push(id)); salvar(); render(); };
  $("#pinSalvar").onclick = () => { const p = $("#novoPin").value.trim(); if (p.length < 4) return toast("Use pelo menos 4 dígitos"); dados.pin = p; salvar(); toast("Senha trocada 🔑"); };
  $("#sair").onclick = () => { paisLiberado = false; renderPais(); };
  el.querySelectorAll("[data-del-t]").forEach(b => b.onclick = () => { dados.tarefas = dados.tarefas.filter(t => t.id !== b.dataset.delT); salvar(); render(); });
  el.querySelectorAll("[data-del-r]").forEach(b => b.onclick = () => { const id = b.dataset.delR;
    dados.revezamentos = dados.revezamentos.filter(r => r.id !== id);
    dados.tarefas.forEach(t => { if (t.para === "vez:"+id) t.para = "todos"; }); salvar(); render(); });
  el.querySelectorAll("[data-del-c]").forEach(b => b.onclick = () => { const id = b.dataset.delC;
    dados.criancas = dados.criancas.filter(c => c.id !== id);
    dados.revezamentos.forEach(r => r.ordem = r.ordem.filter(x => x !== id));
    if (criancaAtiva === id) criancaAtiva = dados.criancas[0]?.id; salvar(); render(); });
}

/* ===== Efeitos ===== */
let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800); }
function confete(n){
  const em = ["⭐","🎉","✨","💜","🌟","🎈"];
  for (let i = 0; i < n; i++) { const s = document.createElement("div"); s.className = "confete";
    s.textContent = em[i % em.length]; s.style.left = Math.random()*100 + "vw"; s.style.animationDelay = Math.random()*.4 + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 2000); }
  if (navigator.vibrate) navigator.vibrate(30);
}

/* ===== Navegação ===== */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tela").forEach(s => s.classList.toggle("on", s.id === "t-" + b.dataset.t));
  $("#kids").style.display = b.dataset.t === "pais" ? "none" : "flex";
  render();
});

function render(){ renderCabecalho(); renderMissoes(); renderVez(); renderPlacar(); if ($("#t-pais").classList.contains("on")) renderPais(); }
render();
