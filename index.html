<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7738EA">
<title>Missão Casa</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Brand system 0.1 — "A vida real vira brincadeira".
     Amarelo e roxo protagonistas, creme como respiro, tinta nos textos e contornos.
     Linguagem de jogo independente: formas expressivas com contorno em tinta, composição limpa. */
  :root{
    --sol:#FFD52A; --roxo-eletrico:#7738EA; --lilas:#B06CFF; --coral:#FF6654; --piscina:#29BCE5; --lima:#A5DD37; --creme:#FFFDF5; --tinta:#242034;
    --pri:var(--roxo-eletrico); --pri-esc:#5A22C2;
    --verde:var(--lima); --verde-esc:#4F7A0C;
    --amarelo:var(--sol); --amarelo-esc:#D9B000;
    --laranja:var(--coral); --vermelho:var(--coral); --roxo:var(--roxo-eletrico); --roxo-esc:#5A22C2; --rosa:var(--lilas);
    --fundo:var(--creme); --card:#FFFFFF; --borda:#ECE6D6; --borda-esc:#D5CDBA;
    --texto:var(--tinta); --suave:#615C74;
    --titulo:"Fredoka","Nunito",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:18px}
  body{margin:0;font-family:"Nunito",system-ui,sans-serif;font-weight:700;background:var(--fundo);color:var(--texto);
       padding-bottom:calc(96px + env(safe-area-inset-bottom));line-height:1.3}
  button{font-family:inherit}

  header{background:var(--pri);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 46px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-40px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
  header h1{margin:0;font-family:var(--titulo);font-weight:700;font-size:1.75rem;letter-spacing:.2px}
  header p{margin:4px 0 0;font-size:1rem;opacity:.95}
  main{padding:0 16px;max-width:560px;margin:0 auto}
  h2{font-family:var(--titulo);font-weight:600;font-size:1.4rem;margin:22px 4px 10px}

  /* Crianças */
  .kids{display:flex;gap:12px;margin-top:-32px;overflow-x:auto;padding:4px 2px 10px;position:relative;z-index:1}
  .kid{flex:1;min-width:120px;background:var(--card);border:3px solid var(--borda);border-bottom-width:6px;border-radius:24px;padding:10px 8px;
       text-align:center;cursor:pointer;font-family:var(--titulo);font-weight:600;font-size:1.2rem;transition:transform .1s}
  .kid:active{transform:translateY(3px);border-bottom-width:3px}
  .kid .av{font-size:2.6rem;line-height:1.1}
  .kid.on{border-color:var(--pri);background:#EFE6FF}
  .kid small{display:block;color:var(--suave);font-family:"Nunito";font-weight:800;font-size:.85rem;margin-top:2px}

  /* Semana */
  .semana{background:var(--card);border:2px solid var(--borda);border-bottom-width:5px;border-radius:24px;padding:12px;margin-top:10px}
  .semana .topo{display:flex;align-items:center;justify-content:space-between;font-family:var(--titulo);font-weight:600;font-size:1.15rem;margin-bottom:10px;text-transform:capitalize}
  .semana .topo button{background:var(--card);color:var(--pri);border:2px solid var(--borda);border-bottom-width:4px;border-radius:14px;
       min-width:44px;height:44px;font-size:1.3rem;font-weight:900;cursor:pointer}
  .semana .topo button:active{transform:translateY(2px);border-bottom-width:2px}
  .semana .topo .hojeBtn{padding:0 12px;font-size:.95rem;color:#fff;background:var(--pri);border-color:var(--pri-esc)}
  .diasNav{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .diaNav{border-radius:16px;padding:8px 0 6px;text-align:center;cursor:pointer;border:2px solid transparent;min-height:72px}
  .diaNav .sem{font-size:.75rem;color:var(--suave);font-weight:900;text-transform:uppercase;letter-spacing:.5px}
  .diaNav .num{font-family:var(--titulo);font-weight:600;font-size:1.35rem}
  .diaNav .pt{height:12px;font-size:.7rem;line-height:12px;color:var(--amarelo-esc);letter-spacing:1px}
  .diaNav.fds .num{color:var(--roxo-esc)}
  .diaNav.hoje{background:#FFF3BF}
  .diaNav.sel{border-color:var(--pri);background:#EFE6FF;border-bottom-width:4px}
  .diaNav.sel .num{color:var(--pri-esc)}

  /* Progresso do dia */
  .progresso{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--borda);border-bottom-width:5px;border-radius:22px;padding:12px 16px;margin:14px 0 4px}
  .progresso .estrela{font-size:2rem}
  .progresso .info{flex:1}
  .progresso .info b{font-family:var(--titulo);font-weight:600;font-size:1.1rem}
  .progresso .trilho{height:18px;background:var(--borda);border-radius:12px;margin-top:6px;overflow:hidden}
  .progresso .trilho i{display:block;height:100%;background:var(--verde);border-radius:12px;transition:width .5s;
       box-shadow:inset 0 -5px 0 rgba(0,0,0,.08), inset 0 4px 0 rgba(255,255,255,.35)}

  .aviso{background:#EFE6FF;color:var(--pri-esc);border-radius:18px;padding:12px 14px;font-weight:800;font-size:1rem;margin:12px 0 0}

  /* Agenda */
  .agenda{background:var(--card);border:2px solid var(--borda);border-bottom-width:5px;border-radius:24px;padding:14px 16px;margin:14px 0 0}
  .agenda b{display:block;margin-bottom:6px;font-family:var(--titulo);font-weight:600;font-size:1.2rem}
  .atv{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--borda);font-weight:800;font-size:1.1rem}
  .atv:last-child{border:0}
  .atv .hora{background:#F3E9FF;color:var(--roxo-esc);border-radius:12px;padding:4px 10px;font-size:.95rem;min-width:66px;text-align:center;font-weight:900}
  .atv .ic{font-size:1.7rem}

  /* Missões */
  .periodo{display:flex;justify-content:space-between;align-items:center;font-family:var(--titulo);font-weight:600;font-size:1.25rem;margin:22px 4px 10px}
  .periodo span{background:var(--card);border:2px solid var(--borda);border-radius:12px;padding:2px 10px;font-family:"Nunito";font-weight:900;font-size:.85rem;color:var(--suave)}
  .missao{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--borda);border-bottom-width:6px;border-radius:24px;
          padding:14px;margin-bottom:12px;cursor:pointer;min-height:84px;transition:transform .1s,background .2s}
  .missao:active{transform:translateY(3px);border-bottom-width:3px;margin-bottom:15px}
  .missao .ic{font-size:2.1rem;width:62px;height:62px;flex:none;border-radius:18px;display:grid;place-items:center;
              background:color-mix(in srgb, var(--c, var(--pri)) 22%, white)}
  .missao .tx{flex:1;font-weight:900;font-size:1.2rem;line-height:1.2}
  .missao .tx small{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:.85rem}
  .pill{background:#FFF3BF;color:#6E5400;border-radius:10px;padding:2px 8px;font-weight:900}
  .pill.vez{background:#F3E9FF;color:var(--roxo-esc)}
  .missao .ok{width:48px;height:48px;flex:none;border-radius:50%;border:3px solid var(--borda-esc);display:grid;place-items:center;font-size:1.5rem;color:#fff;font-weight:900}
  .missao.feita{background:#EEF9D2;border-color:var(--verde)}
  .missao.feita .ok{background:var(--verde);border-color:var(--verde-esc);animation:pop .35s}
  .missao.feita .tx{color:var(--verde-esc)}
  .missao.futura{cursor:default}
  .missao.futura .ok{border-style:dashed}
  @keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .vazio{text-align:center;color:var(--suave);padding:28px 16px;font-weight:800;font-size:1.15rem}

  /* Placar */
  .premio{background:var(--amarelo);color:#4A3A00;border:2px solid var(--amarelo-esc);border-bottom-width:6px;border-radius:24px;padding:16px 18px;font-weight:800;margin-bottom:14px;font-size:1rem}
  .premio b{font-family:var(--titulo);font-weight:600;font-size:1.5rem;display:block;margin:4px 0;color:#242034}
  .placar{background:var(--card);border:2px solid var(--borda);border-bottom-width:5px;border-radius:24px;padding:14px 16px;margin-bottom:14px}
  .placar .linha{display:flex;justify-content:space-between;font-family:var(--titulo);font-weight:600;font-size:1.35rem}
  .barra{height:22px;background:var(--borda);border-radius:14px;margin:10px 0 8px;overflow:hidden}
  .barra i{display:block;height:100%;border-radius:14px;background:var(--verde);transition:width .5s;
       box-shadow:inset 0 -6px 0 rgba(0,0,0,.08), inset 0 5px 0 rgba(255,255,255,.35)}
  .placar small{color:var(--suave);font-weight:800;font-size:.95rem}
  .dias{display:flex;gap:6px;margin-top:10px}
  .dias span{flex:1;text-align:center;font-size:.8rem;font-weight:900;color:var(--suave)}
  .dias span i{display:block;height:32px;border-radius:10px;background:var(--borda);margin-bottom:4px;font-style:normal;line-height:32px;font-size:1rem}
  .dias span i.sim{background:var(--verde);color:#fff}
  .dias span i.livre{background:transparent;border:2px dashed var(--borda)}

  /* Barra de navegação */
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:space-around;
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:2px solid var(--borda);z-index:5}
  nav button{background:none;border:2px solid transparent;font-weight:900;font-size:.78rem;color:var(--suave);display:flex;flex-direction:column;
             align-items:center;gap:2px;padding:6px 4px;border-radius:16px;cursor:pointer;flex:1;max-width:110px}
  nav button span{font-size:1.8rem;line-height:1}
  nav button.on{color:var(--pri-esc);background:#EFE6FF;border-color:#C9A8FF}
  .tela{display:none}.tela.on{display:block;animation:entra .25s}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

  /* Painel dos pais (mais compacto, é para adultos) */
  #t-pais{font-size:.95rem}
  .bloco{background:var(--card);border:2px solid var(--borda);border-bottom-width:5px;border-radius:22px;padding:16px;margin-bottom:14px}
  .bloco > b{font-family:var(--titulo);font-weight:600;font-size:1.15rem}
  .item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:2px dashed var(--borda);font-weight:800;flex-wrap:wrap}
  .item:last-child{border:0}
  .item .acoes{margin-left:auto;display:flex;gap:6px}
  .item small{color:var(--suave);font-weight:700;width:100%;padding-left:2px}
  .x,.ed{border:2px solid;border-bottom-width:4px;border-radius:12px;padding:5px 12px;font-weight:900;cursor:pointer;font-size:.85rem}
  .x{background:#FFEDEA;color:#C93A2A;border-color:#FFC2BA}
  .ed{background:#EFE6FF;color:var(--pri-esc);border-color:#C9A8FF}
  input,select{font:inherit;font-size:1rem;padding:12px;border-radius:14px;border:2px solid var(--borda);width:100%;margin:5px 0;background:#F8F5EC;color:var(--texto)}
  input:focus,select:focus{outline:none;border-color:var(--pri);background:#fff}
  .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
  .btn{background:var(--verde);color:#fff;border:0;border-bottom:5px solid var(--verde-esc);border-radius:16px;padding:13px;font-size:1rem;font-weight:900;
       width:100%;margin-top:8px;cursor:pointer;text-transform:uppercase;letter-spacing:.6px}
  .btn:active{transform:translateY(3px);border-bottom-width:2px}
  .btn.sec{background:#fff;color:var(--pri-esc);border:2px solid var(--borda);border-bottom-width:5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chip{border:2px solid var(--borda);border-bottom-width:4px;background:#fff;border-radius:14px;padding:8px 11px;font-weight:900;font-size:.9rem;cursor:pointer;color:var(--suave)}
  .chip.on{background:#EFE6FF;border-color:var(--pri);color:var(--pri-esc)}
  .chip.atalho{border-style:dashed;border-bottom-width:2px}
  .editando{outline:3px solid var(--amarelo);border-radius:16px;padding:10px;margin:8px -4px}
  .pin{max-width:280px;margin:40px auto;text-align:center}
  .pin .cadeado{font-size:3.5rem}

  .toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%) scale(.8);background:var(--texto);color:#fff;padding:14px 20px;
         border-radius:18px;font-weight:900;font-size:1.05rem;opacity:0;transition:.25s;z-index:20;pointer-events:none;text-align:center;max-width:90vw}
  .toast.on{opacity:1;transform:translateX(-50%) scale(1)}
  .confete{position:fixed;top:-30px;font-size:1.8rem;z-index:19;pointer-events:none;animation:cai 1.5s ease-in forwards}
  @keyframes cai{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
  /* Tela de entrada */
  .entrada{position:fixed;inset:0;background:var(--fundo);z-index:30;overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 22px 30px}
  .entrada .caixa{max-width:420px;margin:0 auto;text-align:center}
  .entrada .logo{font-size:4.2rem;line-height:1}
  .entrada h1{font-family:var(--titulo);font-weight:700;font-size:2rem;margin:8px 0 4px;color:var(--pri-esc)}
  .entrada p{color:var(--suave);margin:4px 0 22px}
  .entrada .grande{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--borda);border-bottom-width:6px;
       border-radius:24px;padding:16px;margin-bottom:14px;cursor:pointer;font-family:var(--titulo);font-weight:600;font-size:1.3rem;color:var(--texto)}
  .entrada .grande:active{transform:translateY(3px);border-bottom-width:3px}
  .entrada .grande span{font-size:2.4rem}
  .entrada .grande small{display:block;font-family:"Nunito";font-weight:700;font-size:.85rem;color:var(--suave)}
  .entrada .link{background:none;border:0;color:var(--pri-esc);font-weight:900;font-size:.95rem;margin-top:12px;cursor:pointer;text-decoration:underline}
  .entrada input{text-align:left}
  .entrada .codigo{text-align:center;font-family:var(--titulo);font-size:2rem;letter-spacing:8px;text-transform:uppercase}
  .erro{color:#C93A2A;font-weight:800;min-height:1.2em;margin:6px 0}
  .codigoFam{font-family:var(--titulo);font-weight:700;font-size:2rem;letter-spacing:6px;color:var(--pri-esc);background:#EFE6FF;border-radius:16px;padding:8px;text-align:center;margin:8px 0}
  .nuvem{font-size:.8rem;font-weight:800;opacity:.9;margin-top:2px}
  .rot{color:var(--suave);font-weight:800;display:block;margin-top:10px}
  .codigoFam.conv{font-size:1.25rem;letter-spacing:2px;user-select:all}

  /* Resultados */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .kpi{background:#F8F5EC;border-radius:16px;padding:10px 6px;text-align:center}
  .kpi b{display:block;font-family:var(--titulo);font-weight:700;font-size:1.5rem}
  .kpi small{color:var(--suave);font-weight:800;font-size:.75rem}
  .colunas{display:flex;align-items:flex-end;gap:10px;height:120px;margin:12px 0 4px;padding:0 4px}
  .colunas div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-weight:900;font-size:.8rem}
  .colunas i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:var(--pri);min-height:4px}
  .colunas div.atual i{background:var(--verde)}
  .colunas span{color:var(--suave);font-size:.72rem;margin-top:4px}
  .lista-r{margin:6px 0 0;padding:0;list-style:none}
  .lista-r li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:2px dashed var(--borda);font-weight:800}
  .lista-r li:last-child{border:0}
  .lista-r li span{color:var(--suave)}
  .sub{font-family:var(--titulo);font-weight:600;font-size:1.05rem;margin:14px 0 2px;display:block}

  /* Loja */
  .cofre{display:flex;align-items:center;gap:14px;background:var(--amarelo);border:2px solid var(--amarelo-esc);border-bottom-width:6px;border-radius:24px;padding:14px 18px;margin-top:14px;color:#4A3A00}
  .cofre .moeda{font-size:2.6rem}
  .cofre small{display:block;font-weight:800}
  .cofre b{font-family:var(--titulo);font-weight:700;font-size:2.2rem;line-height:1;color:#242034}
  .vitrine{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .produto{background:var(--card);border:2px solid var(--borda);border-bottom-width:5px;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .produto .ptx{font-weight:900;font-size:1rem;flex:1}
  .produto .preco{font-family:var(--titulo);font-weight:600;font-size:1.15rem;color:#6E5400}
  .produto.falta{opacity:.75}
  .trocar{background:var(--verde);color:#fff;border:0;border-bottom:4px solid var(--verde-esc);border-radius:14px;padding:10px;font-weight:900;font-size:.95rem;cursor:pointer}
  .trocar.conf{background:var(--laranja);border-color:#D94A3A}
  .trocar:disabled{background:var(--borda);border-color:var(--borda-esc);color:var(--suave);cursor:default}
  .pedido{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:2px solid var(--borda);border-radius:16px;padding:10px 12px;margin-bottom:8px;font-weight:800}
  .pedido .st{white-space:nowrap;color:var(--suave)}
  .pedido .st.entregue{color:var(--verde-esc)}
  /* Pausa, áudio, tipos de agenda */
  .aviso.pausa{background:#FFF3BF;color:#6E5400}
  .pausaTag{background:#FFF3BF;color:#6E5400;border-radius:12px;padding:6px 10px;font-weight:800;font-size:.9rem;margin-bottom:6px}
  .som{background:#F3E9FF;border:2px solid #DCC6FF;border-bottom-width:4px;border-radius:14px;width:44px;height:44px;font-size:1.2rem;cursor:pointer;flex:none}
  .som:active{transform:translateY(2px);border-bottom-width:2px}
  .atv{cursor:pointer}
  .atv .hora{background:color-mix(in srgb, var(--t, var(--roxo)) 16%, white);color:color-mix(in srgb, var(--t, var(--roxo)) 80%, black)}
  .nomeAtv{flex:1}
  .nomeAtv small{display:block;font-size:.78rem;color:var(--suave);font-weight:800}

  /* ---- Brand system 0.1: contorno em tinta nos elementos de jogo ---- */
  header{background:var(--pri);padding-right:70px}
  header::after{right:-36px;top:-56px;width:150px;height:150px;background:var(--sol);border:3px solid var(--tinta)}
  .somBtn{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:2;width:48px;height:48px;border-radius:16px;background:var(--creme);
          border:2px solid var(--tinta);border-bottom-width:4px;display:grid;place-items:center;cursor:pointer;padding:0}
  .somBtn:active{transform:translateY(2px);border-bottom-width:2px}
  .kid,.missao,.produto,.cofre,.premio,.entrada .grande{border-color:var(--tinta);border-width:2px;border-bottom-width:5px}
  .kid:active,.missao:active,.entrada .grande:active{border-bottom-width:2px}
  .kid .av{position:relative;display:block;width:68px;margin:0 auto 2px;line-height:0}
  .kid .lapis{position:absolute;right:-8px;bottom:0;font-size:.9rem;line-height:1;background:var(--sol);border:2px solid var(--tinta);border-radius:10px;padding:3px}
  .kid.on{border-color:var(--pri);background:#EFE6FF;box-shadow:0 0 0 3px #C9A8FF}
  .missao .ic{border:2px solid var(--tinta)}
  .missao .ok{border-color:var(--tinta)}
  .missao.feita{background:#EEF9D2;border-color:var(--tinta)}
  .missao.feita .ok{background:var(--lima);border-color:var(--tinta);color:var(--tinta)}
  .missao.feita .tx{color:var(--verde-esc)}
  .pill{display:inline-flex;align-items:center;gap:4px;background:#FFF3BF;color:var(--tinta)}
  .pill.vez{background:#F3E9FF;color:var(--pri-esc)}
  .ico{flex:none;display:inline-block;vertical-align:middle}
  .quem{display:inline-flex;align-items:center;gap:8px}
  .progresso .estrela{line-height:0}
  .progresso .trilho{border:2px solid var(--tinta);height:20px}
  .progresso.completo{position:relative;overflow:hidden;border-color:var(--tinta);background:#FFFBEA}
  .progresso.completo::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--sol),var(--roxo-eletrico))}
  .barra{border:2px solid var(--tinta)}
  .cofre{background:var(--sol);color:var(--tinta)}
  .cofre b{color:var(--tinta)}

  .trocar.conf{background:var(--coral);border-bottom-color:#C93A2A}
  nav{border-top:2px solid var(--tinta);background:var(--creme)}
  nav button.on{background:#EFE6FF;border-color:var(--pri);color:var(--pri-esc)}

  .diaNav.hoje{background:#FFF3BF}
  .entrada .logo{display:flex;justify-content:center;gap:4px;line-height:0}

  .codigoFam{color:var(--pri-esc);background:#EFE6FF}
  .atv .hora{border:2px solid color-mix(in srgb, var(--t, var(--roxo)) 45%, white)}

  .folha{position:fixed;inset:0;background:rgba(36,32,52,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .folhaCaixa{background:var(--creme);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;border:2px solid var(--tinta);border-bottom:0;
              padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:sobe .3s ease-out}
  @keyframes sobe{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .palco{display:grid;place-items:center;background:linear-gradient(135deg,var(--sol),var(--roxo-eletrico));border:2px solid var(--tinta);border-radius:24px;padding:10px;margin-bottom:6px}

  .opc{flex:none;min-width:84px;background:#fff;border:2px solid var(--borda);border-bottom-width:4px;border-radius:18px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tinta)}
  .opc small{font-size:.72rem;font-weight:800}
  .opc.on{border-color:var(--pri);background:#EFE6FF;box-shadow:0 0 0 3px #C9A8FF}

  .opcs.cores i{display:block;width:40px;height:40px;border-radius:50%;border:2px solid var(--tinta)}

  body.calmo *{animation:none!important;transition:none!important}

function normalizar(d){
  d.criancas = d.criancas || []; d.tarefas = d.tarefas || []; d.feitos = d.feitos || {};
  // dia em que a família começou a usar: os resultados não contam nada antes disso
  d.inicio = d.inicio || Object.keys(d.feitos).sort()[0] || isoDia(new Date());
  d.premio = d.premio || { texto: PADRAO.premio.texto, meta: 150 };
  d.atividades = d.atividades || [];
  if (!Array.isArray(d.recompensas)) d.recompensas = JSON.parse(JSON.stringify(PADRAO.recompensas));
  // versão anterior guardava recompensas como texto; agora cada uma tem custo em estrelas
  d.recompensas = d.recompensas.map((r, i) => typeof r === "string" ? { id: "r" + i + "_" + r.length, texto: r, custo: 50 } : r);
  if (d.premio?.texto && !d.recompensas.some(r => r.texto === d.premio.texto)) d.recompensas.unshift({ id: "rp", texto: d.premio.texto, custo: 50 });
  d.pausas = Array.isArray(d.pausas) ? d.pausas : [];
  d.avatares = d.avatares && typeof d.avatares === "object" ? d.avatares : {};
  const bases = ["orbita", "faisca", "pingo", "zigue"];
  d.criancas.forEach((c, i) => { if (!d.avatares[c.id]) d.avatares[c.id] = { p: bases[i % 4] }; });
  d.trocas = d.trocas && typeof d.trocas === "object" ? d.trocas : {};
  d.atividades.forEach(a => { if (!a.tipo) a.tipo = /escola|col[eé]gio/i.test(a.nome) ? "escola" : "atividade"; if (!Array.isArray(a.dias)) a.dias = []; });
  // versão anterior tinha revezamentos separados: viram missões com "revezar"
  if (Array.isArray(d.revezamentos)) {
    d.revezamentos.forEach((r, i) => {
      const ligadas = d.tarefas.filter(t => t.para === "vez:" + r.id);
      ligadas.forEach(t => { t.para = "todos"; t.revezar = true; t.offset = i; });
      if (!ligadas.length) d.tarefas.push({ id: "t" + r.id, nome: r.nome, icone: r.icone, pontos: 5, para: "todos", revezar: true, offset: i, dias: [...TODOS], cor: "#29BCE5" });
    });
    delete d.revezamentos;
  }
  // versões antigas não tinham "dias" nas missões: vale todo dia
  d.tarefas.forEach(t => { if (!Array.isArray(t.dias)) t.dias = [...TODOS]; });
  // cores da versão anterior viram as cores da marca
  const CORES_ANTIGAS = { "#1cb0f6": "#29BCE5", "#3ba7ff": "#29BCE5", "#ff86d0": "#B06CFF", "#ff5fa2": "#B06CFF", "#58cc02": "#A5DD37", "#2bc48a": "#A5DD37",
    "#ff9600": "#FF6654", "#ff8a3d": "#FF6654", "#ce82ff": "#7738EA", "#7c5cff": "#7738EA", "#ffc800": "#FFD52A", "#ffc93c": "#FFD52A" };
  d.tarefas.forEach(t => { const n = CORES_ANTIGAS[String(t.cor || "").toLowerCase()]; if (n) t.cor = n; });
  d.tarefas.forEach(t => { if (!Array.isArray(t.periodos) || !t.periodos.length) t.periodos = ["livre"]; });
  return d;
}

/* ===== Datas ===== */
function isoDia(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
const hojeStr = () => isoDia(new Date());
function numeroDoDia(d){ return Math.floor(new Date(isoDia(d)+"T12:00:00").getTime() / 86400000); }
function inicioSemana(d){ const x = new Date(d); const dow = (x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(12,0,0,0); return x; }
function diasDaSemana(base = new Date()){ const ini = inicioSemana(base); return [...Array(7)].map((_,i)=>{ const x=new Date(ini); x.setDate(ini.getDate()+i); return x; }); }
const mesmoDia = (a, b) => isoDia(a) === isoDia(b);
const ehHoje = d => mesmoDia(d, new Date());
const ehFuturo = d => isoDia(d) > hojeStr();
function rotuloDia(d){
  const amanha = new Date(); amanha.setDate(amanha.getDate()+1);
  const ontem = new Date(); ontem.setDate(ontem.getDate()-1);
  if (ehHoje(d)) return "hoje";
  if (mesmoDia(d, amanha)) return "amanhã";
  if (mesmoDia(d, ontem)) return "ontem";
  return NOME_DIA_LONGO[d.getDay()] + ", " + d.toLocaleDateString("pt-BR", { day:"numeric", month:"short" });
}
function resumoDias(dias){
  const s = [...dias].sort().join();
  if (s === TODOS.join()) return "todo dia";
  if (s === UTEIS.join()) return "dias de semana";
  if (s === FDS.join()) return "fim de semana";
  if (!dias.length) return "nenhum dia";
  return ORDEM_UI.filter(i => dias.includes(i)).map(i => NOME_DIA[i]).join(", ");
}

/* ===== Regras ===== */
const crianca = id => dados.criancas.find(c => c.id === id);
// Revezamento: alterna a cada vez que a missão acontece (não a cada dia do calendário),
// assim uma missão de seg/qua/sex também troca certinho.
function vezDe(t, d = new Date()){
  const n = dados.criancas.length; if (!n || !t.dias.length) return null;
  const dn = numeroDoDia(d), seg = dn - ((d.getDay() + 6) % 7);   // número do dia da segunda-feira
  const semana = Math.floor(seg / 7);
  const naSemana = ORDEM_UI.slice(0, ORDEM_UI.indexOf(d.getDay())).filter(i => t.dias.includes(i)).length;
  const vez = semana * t.dias.length + naSemana + (t.offset || 0);
  return dados.criancas[((vez % n) + n) % n].id;
}
const chaveDe = (t, p) => p === "livre" ? t.id : t.id + "@" + p;
const tarefaDaChave = k => dados.tarefas.find(t => t.id === String(k).split("@")[0]);
function pausaDe(idCrianca, d, oque){
  const dia = isoDia(d);
  return dados.pausas.find(p => p.inicio <= dia && dia <= p.fim && (p.para === "todos" || p.para === idCrianca)
    && (p.oque === "tudo" || p.oque === oque));
}
function tarefasDe(idCrianca, d = new Date()){
  const ordemP = PERIODOS.map(p => p.id);
  if (pausaDe(idCrianca, d, "missoes")) return [];
  return dados.tarefas.filter(t => {
    if (!t.dias.includes(d.getDay())) return false;
    if (t.para === "todos") return t.revezar && dados.criancas.length > 1 ? vezDe(t, d) === idCrianca : true;
    return t.para === idCrianca;
  }).flatMap(t => t.periodos.map(p => ({ ...t, periodo: p, key: chaveDe(t, p) })))
    .sort((a, b) => ordemP.indexOf(a.periodo) - ordemP.indexOf(b.periodo));
}
function atividadesDe(idCrianca, d = new Date()){
  const pausada = !!pausaDe(idCrianca, d, "agenda"), dia = isoDia(d);
  return dados.atividades.filter(a => (a.para === "todos" || a.para === idCrianca)
      && (a.data ? a.data === dia : (!pausada && a.dias.includes(d.getDay()))))
    .sort((a, b) => (a.hora || "99").localeCompare(b.hora || "99"));
}
const feitosEm = (dia, id) => (dados.feitos[dia] && dados.feitos[dia][id]) || [];
function pontosDoDia(dia, id){ return feitosEm(dia, id).reduce((s, k) => s + (tarefaDaChave(k)?.pontos || 0), 0); }
// Estrelas da loja: tudo o que a criança já ganhou menos o que já trocou
function estrelasGanhas(id){ return Object.keys(dados.feitos).reduce((s, dia) => s + pontosDoDia(dia, id), 0); }
function estrelasGastas(id){ return Object.values(dados.trocas).filter(t => t.kid === id && t.status !== "cancelado").reduce((s, t) => s + (Number(t.custo) || 0), 0); }
const saldo = id => estrelasGanhas(id) - estrelasGastas(id);
function pontosSemana(id){ return diasDaSemana().reduce((s, d) => s + pontosDoDia(isoDia(d), id), 0); }
function diaCompleto(dia, id, d){ const ts = tarefasDe(id, d); return ts.length > 0 && ts.every(t => feitosEm(dia, id).includes(t.key)); }
// Sequência de dias completos. Dias sem missão (folga) não contam e não quebram.
function sequencia(id){
  let n = 0; const d = new Date();
  if (!diaCompleto(isoDia(d), id, d)) d.setDate(d.getDate()-1);
  for (let i = 0; i < 400; i++) {
    if (tarefasDe(id, d).length === 0) { d.setDate(d.getDate()-1); continue; }
    if (!diaCompleto(isoDia(d), id, d)) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}

function alternar(key){
  const dia = hojeStr();
  dados.feitos[dia] = dados.feitos[dia] || {};
  const lista = dados.feitos[dia][criancaAtiva] = dados.feitos[dia][criancaAtiva] || [];
  const i = lista.indexOf(key);
  if (i >= 0) { lista.splice(i, 1); }
  else {
    lista.push(key);
    const t = tarefaDaChave(key);
    if (diaCompleto(dia, criancaAtiva, new Date())) { toast("🏆 Todas as missões feitas! Sequência: " + sequencia(criancaAtiva) + " 🔥"); confete(36); vinheta("tudo"); }
    else { toast(`+${t.pontos} moedas!`); vinheta("ok"); }
  }
  salvar(); render();
}

const iconeMotivo = p => (MOTIVOS_PAUSA.find(m => m.id === p.motivo) || MOTIVOS_PAUSA[5]).icone;
const nomeMotivo = p => p.texto || (MOTIVOS_PAUSA.find(m => m.id === p.motivo) || MOTIVOS_PAUSA[5]).nome;
const dataCurta = iso => new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { day: "numeric", month: "short" });

/* ===== Loja de recompensas ===== */
function renderLoja(){
  const el = $("#lojaConteudo"), c = crianca(criancaAtiva);
  if (!c) { el.innerHTML = `<div class="vazio">Cadastre as crianças no painel dos pais.</div>`; return; }
  const s = saldo(c.id);
  const pedidos = Object.values(dados.trocas).filter(t => t.kid === c.id && t.status !== "cancelado").sort((a, b) => b.data.localeCompare(a.data)).slice(0, 6);
  el.innerHTML = `
    <div class="cofre"><div class="moeda">${icone("moeda", 60)}</div><div style="flex:1"><small>Moedas de ${esc(c.nome)}</small><b>${s}</b></div>${avatarHTML(c, 64)}</div>
    <h2 class="quem">${icone("loja", 34)} Loja de recompensas</h2>
    <div class="vitrine">${[...dados.recompensas].sort((a, b) => a.custo - b.custo).map(r => {
      const pode = s >= r.custo, conf = confirmaTroca === r.id;
      return `<div class="produto ${pode ? "" : "falta"}">
        <div class="ptx">${esc(r.texto)}</div>
        <div class="preco">${icone("moeda", 24)} ${r.custo}</div>
        ${NUVEM.papel === "apoio" ? "" : `<button class="trocar ${conf ? "conf" : ""}" data-rec="${r.id}" ${pode ? "" : "disabled"}>${conf ? "Confirmar?" : pode ? "Trocar" : `Faltam ${r.custo - s}`}</button>`}
      </div>`; }).join("")}</div>
    ${pedidos.length ? `<h2>📦 Meus pedidos</h2>${pedidos.map(t => `<div class="pedido"><span>${esc(t.texto)}</span>
      <span class="st ${t.status}">${t.status === "entregue" ? "✅ Recebido" : "⏳ Esperando os pais"}</span></div>`).join("")}` : ""}`;
  el.querySelectorAll(".trocar").forEach(b => b.onclick = () => {
    const r = dados.recompensas.find(x => x.id === b.dataset.rec); if (!r) return;
    if (confirmaTroca !== r.id) { confirmaTroca = r.id; falar("Trocar " + r.custo + " moedas por " + semEmoji(r.texto) + "?"); return renderLoja(); }
    confirmaTroca = null;
    if (saldo(c.id) < r.custo) return toast("Moedas não são suficientes");
    const id = "x" + Date.now();
    dados.trocas[id] = { id, kid: c.id, rec: r.id, texto: r.texto, custo: r.custo, data: new Date().toISOString(), status: "pedido" };
    salvar(); confete(30); vinheta("loja"); toast("Pedido feito! Agora é com os pais 🎁"); render();
  });
}

function renderPlacar(){
  if (!$("#sairAparelho") && (NUVEM.papel === "apoio" || NUVEM.papel === "crianca")) {
    const b = document.createElement("button"); b.id = "sairAparelho"; b.className = "link"; b.style.cssText = "background:none;border:0;color:var(--suave);font-weight:800;margin:10px auto;display:block;text-decoration:underline;cursor:pointer";
    b.textContent = "Sair deste aparelho"; let n = 0;
    b.onclick = () => { if (++n < 2) { b.textContent = "Toque de novo pra sair"; return; } sairDaConta(); };
    $("#t-placar").appendChild(b);
  }
  const meta = Number(dados.premio.meta) || 100;
  $("#premio").innerHTML = `🎁 Prêmio da semana<b>${esc(dados.premio.texto)}</b>Quem juntar ${meta} moedas na semana ganha!`;
  const dias = diasDaSemana();
  $("#listaPlacar").innerHTML = [...dados.criancas].sort((a,b) => pontosSemana(b.id) - pontosSemana(a.id)).map(c => {
    const p = pontosSemana(c.id), pct = Math.min(100, Math.round(p / meta * 100));
    return `<div class="placar">
      <div class="linha"><span class="quem">${avatarHTML(c, 40)} ${esc(c.nome)}</span><span class="quem">${p} ${icone("moeda", 26)}</span></div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      <small>${pct >= 100 ? "🎉 Ganhou o prêmio!" : `Faltam ${meta - p} moedas`} · 🔥 ${sequencia(c.id)} dia(s) seguidos</small>
      <div class="dias">${dias.map(d => {
        const livre = tarefasDe(c.id, d).length === 0, ok = diaCompleto(isoDia(d), c.id, d);
        return `<span><i class="${ok ? "sim" : livre ? "livre" : ""}">${ok ? "✓" : livre ? "–" : ""}</i>${NOME_DIA[d.getDay()][0]}</span>`; }).join("")}</div>
    </div>`; }).join("");
}

function chipsDias(grupo, arr){
  return `<div class="chips">${ORDEM_UI.map(i => `<button class="chip ${arr.includes(i)?"on":""}" data-g="${grupo}" data-dia="${i}">${NOME_DIA[i]}</button>`).join("")}</div>
    <div class="chips">
      <button class="chip atalho" data-g="${grupo}" data-atalho="todos">Todo dia</button>
      <button class="chip atalho" data-g="${grupo}" data-atalho="uteis">Seg a sex</button>
      <button class="chip atalho" data-g="${grupo}" data-atalho="fds">Fim de semana</button>
    </div>`;
}

function pedirPin(el, depois){
  if (paisLiberado || NUVEM.papel === "pais") return false;
  el.innerHTML = `<div class="pin"><div class="cadeado">🔐</div><h2>Área dos pais</h2><input id="pinIn" type="password" inputmode="numeric" placeholder="Senha (padrão 1234)"><button class="btn" id="pinBtn">Entrar</button></div>`;
  $("#pinBtn").onclick = () => { if ($("#pinIn").value === dados.pin) { paisLiberado = true; depois(); } else toast("Senha errada 🙈"); };
  return true;
}

const temVoz = typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";
function falar(texto){
  if (!temVoz) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = "pt-BR"; u.rate = 0.95;
    const v = speechSynthesis.getVoices().find(v => /pt[-_]BR/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch(e){}
}

/* ===== Som e movimento (preferências deste aparelho) ===== */
const PREF = (() => { try { return JSON.parse(localStorage.getItem(CHAVE + ".pref")) || {}; } catch(e) { return {}; } })();
if (PREF.som === undefined) PREF.som = true;
const gravarPref = () => { try { localStorage.setItem(CHAVE + ".pref", JSON.stringify(PREF)); } catch(e){} };
const menosMovimento = () => PREF.calmo || (typeof matchMedia !== "undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches);
let audioCtx;
function vinheta(tipo = "ok"){
  if (!PREF.som) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notas = tipo === "tudo" ? [523, 659, 784, 1047] : tipo === "loja" ? [784, 988] : [660, 880];
    notas.forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * 0.09;
      o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.25); });
  } catch(e){}
}
function atualizarSomBtn(){ const b = $("#somBtn"); if (b) { b.innerHTML = icone(PREF.som ? "som" : "mudo", 26); b.setAttribute("aria-pressed", PREF.som ? "true" : "false"); } }

function confete(n){

  const cores = ["#FFD52A", "#7738EA", "#B06CFF", "#FF6654", "#29BCE5", "#A5DD37"], formas = ["50%", "4px", "50% 0"];
  for (let i = 0; i < n; i++) { const s = document.createElement("div"); s.className = "confete";
    s.style.background = cores[i % cores.length]; s.style.borderRadius = formas[i % formas.length];

/* ===== Resultados (painel dos pais) ===== */
function estatisticas(idCrianca, dias){
  let previstas = 0, feitas = 0; const porTarefa = {}, porDiaSemana = {};
  dias.forEach(d => {
    const ts = tarefasDe(idCrianca, d), fe = feitosEm(isoDia(d), idCrianca);
    ts.forEach(t => {
      const ok = fe.includes(t.key); previstas++; if (ok) feitas++;
      const pt = porTarefa[t.id] = porTarefa[t.id] || { t, vezes: 0, esquecidas: 0 }; pt.vezes++; if (!ok) pt.esquecidas++;
      const pd = porDiaSemana[d.getDay()] = porDiaSemana[d.getDay()] || { prev: 0, feitas: 0 }; pd.prev++; if (ok) pd.feitas++;
    });
  });
  return { previstas, feitas, pct: previstas ? Math.round(feitas / previstas * 100) : null, porTarefa, porDiaSemana };
}
function diasEntre(ini, fim){ const out = []; const d = new Date(ini); d.setHours(12,0,0,0); const f = isoDia(fim);
  const comeco = dados.inicio || "0000"; while (isoDia(d) < comeco && isoDia(d) <= f) d.setDate(d.getDate()+1);
  while (isoDia(d) <= f) { out.push(new Date(d)); d.setDate(d.getDate()+1); } return out; }

function renderResultados(){
  const el = $("#resultadosConteudo");
  if (pedirPin(el, renderResultados)) return;
  const hoje = new Date(), ontem = new Date(); ontem.setDate(ontem.getDate()-1);
  const ini28 = new Date(); ini28.setDate(ini28.getDate()-28);
  const meta = Number(dados.premio.meta) || 100;
  el.innerHTML = `<h2>📊 Resultados</h2>` + (dados.criancas.length ? dados.criancas.map(c => {
    const semana = estatisticas(c.id, diasEntre(inicioSemana(hoje), hoje));
    const semanas = [3,2,1,0].map(n => { const ini = inicioSemana(hoje); ini.setDate(ini.getDate() - 7*n);
      const fim = new Date(ini); fim.setDate(fim.getDate()+6); const ate = n === 0 ? hoje : fim;
      const st = estatisticas(c.id, diasEntre(ini, ate));
      const pts = diasEntre(ini, ate).reduce((s, d) => s + pontosDoDia(isoDia(d), c.id), 0);
      return { rot: n === 0 ? "esta" : ini.toLocaleDateString("pt-BR", { day: "numeric", month: "numeric" }), pct: st.pct, pts, atual: n === 0 }; });
    const hist = estatisticas(c.id, diasEntre(ini28, ontem));
    const esquecidas = Object.values(hist.porTarefa).filter(x => x.esquecidas > 0).sort((a,b) => b.esquecidas/b.vezes - a.esquecidas/a.vezes).slice(0,3);
    const diasDif = Object.entries(hist.porDiaSemana).filter(([,v]) => v.prev > 0).map(([k,v]) => ({ dia: Number(k), pct: Math.round(v.feitas / v.prev * 100) })).sort((a,b) => a.pct - b.pct);
    const semanasPassadas = [1,2,3,4,5,6,7,8].map(n => { const ini = inicioSemana(hoje); ini.setDate(ini.getDate() - 7*n);
      const fim = new Date(ini); fim.setDate(fim.getDate()+6); return { ini, fim }; }).filter(w => isoDia(w.fim) >= (dados.inicio || ""));
    const premios = semanasPassadas.filter(w => diasEntre(w.ini, w.fim).reduce((s, d) => s + pontosDoDia(isoDia(d), c.id), 0) >= meta).length;
    return `<div class="bloco">
      <b class="quem">${avatarHTML(c, 36)} ${esc(c.nome)}</b>
      <div class="kpis">
        <div class="kpi"><b>${semana.pct ?? "–"}${semana.pct === null ? "" : "%"}</b><small>missões feitas na semana</small></div>
        <div class="kpi"><b>${pontosSemana(c.id)}</b><small>pontos na semana (meta ${meta})</small></div>
        <div class="kpi"><b>${sequencia(c.id)}🔥</b><small>dias seguidos</small></div>
      </div>
      <span class="sub">Últimas 4 semanas</span>
      <div class="colunas">${semanas.map(w => `<div class="${w.atual ? "atual" : ""}">${w.pct === null ? "–" : w.pct + "%"}<i style="height:${w.pct || 0}%"></i><span>${w.rot}</span></div>`).join("")}</div>
      <span class="sub">Missões mais esquecidas (últimos 28 dias, sem contar hoje)</span>
      ${hist.previstas === 0 ? `<div style="color:var(--suave);font-weight:700">Ainda sem dados: aparece depois do primeiro dia de uso.</div>` : esquecidas.length ? `<ul class="lista-r">${esquecidas.map(x => `<li>${esc(x.t.icone)} ${esc(x.t.nome)}<span>${x.esquecidas} de ${x.vezes}</span></li>`).join("")}</ul>` : `<div style="color:var(--suave);font-weight:700">Nenhuma esquecida. 👏</div>`}
      <span class="sub">Dia mais difícil</span>
      <div style="font-weight:800">${diasDif.length && diasDif[0].pct < 100 ? `${NOME_DIA_LONGO[diasDif[0].dia]} <span style="color:var(--suave)">(${diasDif[0].pct}% feitas)</span>` : `<span style="color:var(--suave)">Ainda sem dados suficientes</span>`}</div>
      <span class="sub">Prêmios conquistados</span>
      <div style="font-weight:800">${semanasPassadas.length ? `${premios} de ${semanasPassadas.length} semana(s) <span style="color:var(--suave)">(meta atual de ${meta} pontos)</span>` : `<span style="color:var(--suave)">A primeira semana ainda está rolando</span>`}</div>
    </div>`; }).join("") : `<div class="vazio">Cadastre as crianças no painel dos pais.</div>`)
    + `<small style="color:var(--suave);font-weight:700;display:block;margin:0 4px 10px">Os números usam as missões como estão cadastradas hoje. O dia de hoje entra só na semana atual.</small>`;
}

const FB_VERSAO = "10.14.1";
const lerSessao = () => { try { return JSON.parse(localStorage.getItem(SESSAO)); } catch(e) { return null; } };
const gravarSessao = v => { try { v ? localStorage.setItem(SESSAO, JSON.stringify(v)) : localStorage.removeItem(SESSAO); } catch(e){} };

function carregaScript(src){ return new Promise((ok, falha) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = falha; document.head.appendChild(s); }); }
async function carregaFirebase(cfg){
  const base = `https://cdn.jsdelivr.net/npm/firebase@${FB_VERSAO}/`;
  if (!window.firebase) {
    await carregaScript(base + "firebase-app-compat.js");
    await Promise.all([carregaScript(base + "firebase-auth-compat.js"), carregaScript(base + "firebase-firestore-compat.js")]);
  }
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  return firebase;
}
const db = () => firebase.firestore();
function novosConvites(){ return { resp: novoCodigo(), apoio: novoCodigo() }; }
function novoCodigo(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c = ""; const r = crypto.getRandomValues(new Uint32Array(6)); r.forEach(n => c += a[n % a.length]); return c; }

function marcarSincronizado(){
  NUVEM.ultimo = {};
  CAMPOS_CONFIG.forEach(k => NUVEM.ultimo[k] = JSON.stringify(dados[k]));
  Object.entries(dados.feitos).forEach(([dia, porKid]) => Object.entries(porKid).forEach(([k, v]) => NUVEM.ultimo["f:" + dia + "|" + k] = JSON.stringify(v)));
  Object.entries(dados.trocas).forEach(([id, v]) => NUVEM.ultimo["x:" + id] = JSON.stringify(v));
  Object.entries(dados.avatares).forEach(([id, v]) => NUVEM.ultimo["v:" + id] = JSON.stringify(v));
}
let syncTimer;
function agendarSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(sincronizar, 350); }
async function sincronizar(){
  if (!NUVEM.ativo) return;
  const args = [], marcar = {};
  if (NUVEM.papel === "pais") CAMPOS_CONFIG.forEach(k => { const j = JSON.stringify(dados[k]); if (j !== NUVEM.ultimo[k]) { args.push(k, JSON.parse(j)); marcar[k] = j; } });
  Object.entries(dados.feitos).forEach(([dia, porKid]) => Object.entries(porKid).forEach(([kid, v]) => {
    const chave = "f:" + dia + "|" + kid, j = JSON.stringify(v);
    if (j !== NUVEM.ultimo[chave]) { args.push(new firebase.firestore.FieldPath("feitos", dia, kid), JSON.parse(j)); marcar[chave] = j; }
  }));
  if (NUVEM.papel !== "apoio") Object.entries(dados.trocas).forEach(([id, v]) => {
    const chave = "x:" + id, j = JSON.stringify(v);
    if (j !== NUVEM.ultimo[chave]) { args.push(new firebase.firestore.FieldPath("trocas", id), JSON.parse(j)); marcar[chave] = j; }
  });
  if (NUVEM.papel !== "apoio") Object.entries(dados.avatares).forEach(([id, v]) => {
    const chave = "v:" + id, j = JSON.stringify(v);
    if (j !== NUVEM.ultimo[chave]) { args.push(new firebase.firestore.FieldPath("avatares", id), JSON.parse(j)); marcar[chave] = j; }
  });
  if (!args.length || NUVEM.papel === "apoio") return;
  try { await NUVEM.ref.update(...args); Object.assign(NUVEM.ultimo, marcar); }
  catch(e) { console.warn(e); toast("Não consegui salvar na nuvem. Tento de novo já já 🔄"); setTimeout(agendarSync, 5000); }
}

async function conectarFamilia(codigo, papel){
  NUVEM.codigo = codigo; NUVEM.papel = papel; NUVEM.ref = db().collection("familias").doc(codigo);
  NUVEM.email = firebase.auth().currentUser?.email || null;
  try { const c = localStorage.getItem(CHAVE + ".fam." + codigo); if (c) dados = normalizar(JSON.parse(c)); } catch(e){}
  const snap = await NUVEM.ref.get();
  aplicarRemoto(snap.data());
  // famílias criadas antes dos convites ganham os códigos agora
  if (papel === "pais" && !snap.data()?.convites) { try { NUVEM.convites = novosConvites(); await NUVEM.ref.update({ convites: NUVEM.convites }); } catch(e){ console.warn(e); } }
  NUVEM.ativo = true; gravarSessao({ papel, familia: codigo });
  if (NUVEM.papel === "crianca") paisLiberado = false;
  $("#entrada").style.display = "none";
  $("#statusNuvem").textContent = papel === "pais" ? "☁️ Família " + codigo : papel === "apoio" ? "☁️ Rede de apoio da família" : "☁️ Conectado à família";
  montarNav();
  NUVEM.ref.onSnapshot(sn => { if (sn.metadata.hasPendingWrites) return; aplicarRemoto(sn.data()); render(true); },
    e => { console.warn(e); toast("Perdi o acesso a esta família"); });
}
function aplicarRemoto(r){
  if (!r) return;
  CAMPOS_CONFIG.forEach(k => { if (r[k] !== undefined) dados[k] = r[k]; });
  dados.feitos = r.feitos || {};
  dados.trocas = r.trocas || {};
  dados.avatares = r.avatares || dados.avatares || {};
  NUVEM.aparelhos = (r.aparelhos || []).length; NUVEM.nPais = (r.pais || []).length; NUVEM.nApoio = (r.apoio || []).length;
  if (r.convites) NUVEM.convites = r.convites;
  dados = normalizar(dados);
  marcarSincronizado();
  try { localStorage.setItem(CHAVE + ".fam." + NUVEM.codigo, JSON.stringify(dados)); } catch(e){}
}

async function sairDaConta(){
  gravarSessao(null); NUVEM.ativo = false;
  try { await firebase.auth().signOut(); } catch(e){}
  location.reload();
}

/* ----- Tela de entrada ----- */

  const el = $("#entrada"); el.style.display = "block";

  if (qual === "inicio") {
    el.innerHTML = `<div class="caixa">${topo}<p>As missões da família, do jeito divertido.</p>
      <button class="grande" id="eResp"><span>🧑‍🍼</span><div>Sou responsável<small>Crio a família, as missões e vejo os resultados</small></div></button>
      <button class="grande" id="eKid"><span>🧒</span><div>Sou criança<small>Entro com o código da família</small></div></button>
      <button class="grande" id="eApoio"><span>👵</span><div>Sou da rede de apoio<small>Avós, babá, tios: acompanho a rotina com um convite</small></div></button>
      <button class="link" id="eLocal">Usar sem conta, só neste aparelho</button></div>`;
    $("#eResp").onclick = () => telaEntrada("resp");
    $("#eKid").onclick = () => telaEntrada("kid");
    $("#eApoio").onclick = () => telaEntrada("apoio");
    $("#eLocal").onclick = () => { gravarSessao({ papel: "local" }); el.style.display = "none"; modoLocal(); };
  }
  if (qual === "resp") {
    el.innerHTML = `<div class="caixa">${topo}<p>Entre ou crie sua conta de responsável.</p>
      <input id="eEmail" type="email" autocomplete="email" placeholder="Seu e-mail">
      <input id="eSenha" type="password" autocomplete="current-password" placeholder="Senha (mínimo 6 caracteres)">
      <div class="erro" id="eErro">${esc(erro)}</div>
      <button class="btn" id="eEntrar">Entrar</button>
      <button class="btn sec" id="eCriar">Criar conta</button>
      <button class="link" id="eEsqueci">Esqueci a senha</button><br>
      <button class="link" id="eVoltar">Voltar</button></div>`;
    const cred = () => [$("#eEmail").value.trim(), $("#eSenha").value];
    const tratar = e => { const m = { "auth/invalid-credential": "E-mail ou senha incorretos.", "auth/wrong-password": "Senha incorreta.", "auth/user-not-found": "Não achei essa conta. Que tal criar?",
      "auth/email-already-in-use": "Esse e-mail já tem conta. Toque em Entrar.", "auth/weak-password": "A senha precisa de pelo menos 6 caracteres.", "auth/invalid-email": "Esse e-mail não parece certo." };
      $("#eErro").textContent = m[e.code] || "Não deu certo: " + (e.code || e.message); };
    $("#eEntrar").onclick = async () => { try { await firebase.auth().signInWithEmailAndPassword(...cred()); await depoisDoLoginResp(); } catch(e) { tratar(e); } };
    $("#eCriar").onclick = async () => { try { await firebase.auth().createUserWithEmailAndPassword(...cred()); await depoisDoLoginResp(); } catch(e) { tratar(e); } };
    $("#eEsqueci").onclick = async () => { const [em] = cred(); if (!em) return $("#eErro").textContent = "Escreve seu e-mail primeiro.";
      try { await firebase.auth().sendPasswordResetEmail(em); $("#eErro").textContent = "Mandei um e-mail pra trocar a senha 📬"; } catch(e) { tratar(e); } };
    $("#eVoltar").onclick = () => telaEntrada("inicio");
  }
  if (qual === "criarFamilia") {
    const temLocal = !!localStorage.getItem(CHAVE);
    el.innerHTML = `<div class="caixa">${topo}<p>Agora vamos criar a sua família no Missão Casa.</p>
      ${temLocal ? `<button class="grande" id="fLocal"><span>📲</span><div>Usar o que já cadastrei aqui<small>Leva crianças, missões, agenda e recompensas deste aparelho</small></div></button>` : ""}
      <button class="grande" id="fNova"><span>✨</span><div>Começar do zero<small>Com algumas missões de exemplo</small></div></button>
      <button class="grande" id="fConvite"><span>💌</span><div>Tenho um convite<small>Outro responsável já criou a família e me mandou o código</small></div></button>
      <div class="erro" id="eErro">${esc(erro)}</div>
      <button class="link" id="eSair">Sair da conta</button></div>`;
    if ($("#fLocal")) $("#fLocal").onclick = () => criarFamilia(carregar());
    $("#fNova").onclick = () => criarFamilia(normalizar(JSON.parse(JSON.stringify(PADRAO))));
    $("#fConvite").onclick = () => telaEntrada("conviteResp");
    $("#eSair").onclick = sairDaConta;
  }
  if (qual === "conviteResp" || qual === "apoio") {
    const resp = qual === "conviteResp";
    el.innerHTML = `<div class="caixa">${topo}<p>${resp ? "Cole o convite de responsável que te mandaram 💌" : "Cole o convite da rede de apoio que a família te mandou 💌"}</p>
      <input id="eConv" class="codigo" style="font-size:1.4rem;letter-spacing:3px" maxlength="13" autocomplete="off" autocapitalize="characters" placeholder="ABC123-XYZ789">
      <div class="erro" id="eErro">${esc(erro)}</div>
      <button class="btn" id="eEntrarConv">Entrar na família</button>
      <button class="link" id="eVoltar">Voltar</button></div>`;
    $("#eEntrarConv").onclick = () => entrarComConvite($("#eConv").value.trim().toUpperCase().replace(/\s/g, ""), resp ? "pais" : "apoio");
    $("#eVoltar").onclick = () => telaEntrada(resp ? "criarFamilia" : "inicio");
  }
  if (qual === "kid") {
    el.innerHTML = `<div class="caixa">${topo}<p>Pede pro seu responsável o código da família 🔑</p>
      <input id="eCod" class="codigo" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123">
      <div class="erro" id="eErro">${esc(erro)}</div>
      <button class="btn" id="eEntrarKid">Entrar</button>
      <button class="link" id="eVoltar">Voltar</button></div>`;
    $("#eEntrarKid").onclick = () => entrarComoCrianca($("#eCod").value.trim().toUpperCase());
    $("#eVoltar").onclick = () => telaEntrada("inicio");
  }
}

async function depoisDoLoginResp(){
  const uid = firebase.auth().currentUser.uid;
  const q = await db().collection("familias").where("pais", "array-contains", uid).limit(1).get();
  if (!q.empty) return conectarFamilia(q.docs[0].id, "pais");
  telaEntrada("criarFamilia");
}
async function criarFamilia(base){
  const uid = firebase.auth().currentUser.uid;
  for (let tentativa = 0; tentativa < 5; tentativa++) {
    const codigo = novoCodigo();
    const doc = { dono: uid, pais: [uid], aparelhos: [], apoio: [], convites: novosConvites(), criadoEm: firebase.firestore.FieldValue.serverTimestamp(), feitos: base.feitos || {}, trocas: base.trocas || {}, avatares: base.avatares || {} };
    CAMPOS_CONFIG.forEach(k => doc[k] = JSON.parse(JSON.stringify(base[k])));
    try { await db().collection("familias").doc(codigo).set(doc); dados = base; return conectarFamilia(codigo, "pais"); }
    catch(e) { console.warn(e); }
  }
  telaEntrada("criarFamilia", "Não consegui criar a família. Confere a internet e tenta de novo.");
}
async function entrarComConvite(convite, papel){
  const m = convite.match(/^([A-Z0-9]{6})-?([A-Z0-9]{6})$/);
  const tela = papel === "pais" ? "conviteResp" : "apoio";
  if (!m) return telaEntrada(tela, "O convite tem o formato ABC123-XYZ789.");
  const [, fam, segredo] = m;
  try {
    if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    const uid = firebase.auth().currentUser.uid, ref = db().collection("familias").doc(fam);
    try { await ref.get(); }
    catch(e) { await ref.update({ [papel === "pais" ? "pais" : "apoio"]: firebase.firestore.FieldValue.arrayUnion(uid), entrouCom: segredo }); }
    await conectarFamilia(fam, papel);
    toast(papel === "pais" ? "Agora vocês dividem o painel 💛" : "Bem-vinda(o) à rede de apoio 💛");
  } catch(e) { console.warn(e); telaEntrada(tela, "Esse convite não funcionou. Confere com quem te mandou, pode ter sido trocado."); }
}
async function entrarComoCrianca(codigo){
  if (codigo.length !== 6) return telaEntrada("kid", "O código tem 6 letras e números.");
  try {
    if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    const uid = firebase.auth().currentUser.uid, ref = db().collection("familias").doc(codigo);
    try { await ref.get(); } // já faz parte da família?
    catch(e) { await ref.update({ aparelhos: firebase.firestore.FieldValue.arrayUnion(uid) }); }
    await conectarFamilia(codigo, "crianca");
    toast("Bem-vinda(o) à família! 🎉"); confete(30);
  } catch(e) { console.warn(e); telaEntrada("kid", "Não achei essa família. Confere o código com seu responsável."); }
}

function modoLocal(){ NUVEM.ativo = false; NUVEM.papel = "local"; $("#statusNuvem").textContent = ""; montarNav(); }

async function iniciar(){
  const cfg = window.FIREBASE_CONFIG;
  const sessao = lerSessao();
  if (!cfg || sessao?.papel === "local") return modoLocal();
  modoLocal(); // mostra o app enquanto a nuvem carrega
  try { await carregaFirebase(cfg); }
  catch(e) { toast("Sem internet: usando os dados deste aparelho"); return; }
  const parar = firebase.auth().onAuthStateChanged(async user => {
    parar();
    try {
      if (user && sessao?.familia) return await conectarFamilia(sessao.familia, sessao.papel);
      if (user && !user.isAnonymous) return await depoisDoLoginResp();
    } catch(e) { console.warn(e); }
    telaEntrada("inicio");
  });
}
$("#somBtn").onclick = () => { PREF.som = !PREF.som; gravarPref(); atualizarSomBtn(); if (PREF.som) vinheta("ok"); };
atualizarSomBtn(); aplicarMovimento();
